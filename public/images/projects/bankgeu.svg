<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0F172A"/>
  <!-- Decorative Grid -->
  <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Java Desktop Application Window Mockup -->
  <rect x="150" y="50" width="500" height="350" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="150" y="50" width="500" height="32" fill="#334155"/>
  <text x="170" y="71" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#F8FAFC">BankGeu - Desktop Banking Management System v1.0</text>
  <rect x="615" y="60" width="12" height="12" fill="#EF4444" rx="2"/>
  <rect x="595" y="60" width="12" height="12" fill="#F59E0B" rx="2"/>
  
  <!-- App Workspace -->
  <rect x="170" y="95" width="460" height="290" rx="4" fill="#0F172A"/>
  
  <!-- Header -->
  <text x="190" y="125" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#10B981">BANKGEU CORE BANKING</text>
  <text x="190" y="142" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Secure Java Swing Banking Interface</text>
  
  <!-- Account Card -->
  <rect x="190" y="160" width="420" height="70" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="210" y="185" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#94A3B8">ACCOUNT BALANCE</text>
  <text x="210" y="212" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#34D399">₹ 2,48,500.00</text>
  <rect x="500" y="180" width="90" height="30" rx="4" fill="#059669"/>
  <text x="515" y="200" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF">Transfer</text>
  
  <!-- Recent Transactions Table -->
  <text x="190" y="255" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#CBD5E1">Recent Transactions</text>
  <rect x="190" y="268" width="420" height="24" fill="#1E293B"/>
  <text x="200" y="284" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">ID</text>
  <text x="260" y="284" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">Type</text>
  <text x="360" y="284" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">Amount</text>
  <text x="500" y="284" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">Status</text>
  
  <rect x="190" y="295" width="420" height="22" fill="#0F172A"/>
  <text x="200" y="310" font-family="Inter, sans-serif" font-size="10" fill="#E2E8F0">#TXN9481</text>
  <text x="260" y="310" font-family="Inter, sans-serif" font-size="10" fill="#34D399">Deposit</text>
  <text x="360" y="310" font-family="Inter, sans-serif" font-size="10" fill="#E2E8F0">+₹15,000</text>
  <text x="500" y="310" font-family="Inter, sans-serif" font-size="10" fill="#34D399">Success</text>
  
  <rect x="190" y="320" width="420" height="22" fill="#1E293B"/>
  <text x="200" y="335" font-family="Inter, sans-serif" font-size="10" fill="#E2E8F0">#TXN9480</text>
  <text x="260" y="335" font-family="Inter, sans-serif" font-size="10" fill="#F87171">Withdrawal</text>
  <text x="360" y="335" font-family="Inter, sans-serif" font-size="10" fill="#E2E8F0">-₹2,500</text>
  <text x="500" y="335" font-family="Inter, sans-serif" font-size="10" fill="#34D399">Success</text>
</svg>
